name: reproduce

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy==1.13.1 pandas==2.2.2 matplotlib==3.9.2 pytest==7.4.4

      - name: Run unit tests (C1, C2, C5)
        run: |
          python -m pytest tests/ -v

      - name: Compute dataset SHA-256
        run: |
          python scripts/compute_checksums.py

      - name: Verify bit-identicality of headline numbers
        run: |
          python scripts/verify_reproducibility.py

      - name: Run worked example
        run: |
          python scripts/worked_example.py

      - name: Generate figures
        run: |
          python scripts/make_figures.py

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: figures-${{ matrix.python-version }}
          path: figures/*.pdf
